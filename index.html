rôle un maximum de cases <em>sans jamais faire pat</em>. À chaque coup du roi noir, reprenez cette distance de cavalier. Le roi noir est poussé mécaniquement vers le bord.</p> <p>Quand il est collé au bord, <b>arrêtez de bouger la dame</b> et amenez votre roi. Le mat vient quand votre roi est en face (ou en soutien) et que la dame se pose au contact.</p> <p class='ko'><b>⚠ Le piège du pat.</b> Si le roi noir est au bord et n'a plus de coup, ce n'est pas un mat mais une <em>nulle</em>. Avant chaque coup de dame, posez-vous la question : « après ça, l'adversaire a-t-il encore un coup ? » Le réflexe qui sauve : ne jamais mettre la dame au contact du roi tant que votre propre roi ne la défend pas.</p>","steps":["Dame à distance de cavalier du roi adverse.","Répéter à chaque coup : le roi adverse recule vers le bord.","Bloquer le roi sur une bande de bord (sans le mettre pat).","Amener SON roi en opposition.","Mat au contact avec la dame protégée."],"fixnote":"","src":"github"},{"id":"e-kr","kind":"endgame","tier":1,"side":"w","name":"Roi + Tour contre Roi","sub":"Matez avec la tour. Il faut la coopération du roi.","cat":"Mats élémentaires","fen":"8/8/8/4k3/8/8/8/R3K3 w - - 0 1","goal":"mate","stats":[["Catégorie","Mats élémentaires"],["Objectif","Mater"],["Vous jouez","les Blancs"],["Difficulté","★"]],"idea":"Matez avec la tour. Il faut la coopération du roi.","theory":"<p>Plus difficile que la dame : la tour ne peut pas faire le travail seule, le roi est <em>obligatoire</em>.</p> <p><b>1. La barrière.</b> Posez la tour sur une ligne (rangée ou colonne) qui coupe le roi adverse d'une partie de l'échiquier. Il est désormais prisonnier d'une boîte.</p> <p><b>2. L'opposition.</b> Amenez votre roi face au sien, séparés d'une case (les deux rois en vis-à-vis, une case entre eux). Celui qui doit jouer perd du terrain : c'est le <em>zugzwang</em>, l'obligation de bouger.</p> <p><b>3. Rétrécir.</b> Quand vous avez l'opposition, la tour avance d'un cran : la boîte se réduit d'une rangée. Le roi noir doit reculer. On recommence.</p> <p><b>4. Le mat.</b> Le roi noir sur la dernière rangée, votre roi en opposition juste en face, la tour arrive sur la rangée du bord : mat.</p> <p>Le coup de finesse à connaître : le <em>coup d'attente</em>. Quand le roi noir refuse de se mettre en opposition, jouez un coup neutre de tour sur sa ligne (par exemple Ta1-b1) et il devra bouger le premier.</p>","steps":["Tour : couper le roi (barrière).","Roi : marcher jusqu'à l'opposition.","Tour : avancer d'une rangée (la boîte rétrécit).","Coup d'attente de tour si le roi esquive.","Mat sur la dernière rangée."],"fixnote":"","src":"github"},{"id":"e-opp","kind":"endgame","tier":2,"side":"w","name":"L'opposition (roi + pion)","sub":"Promouvez le pion. Indice : le roi doit passer DEVANT le pion.","cat":"Finales de pions","fen":"8/8/3k4/8/8/3K4/4P3/8 w - - 0 1","goal":"promo","stats":[["Catégorie","Finales de pions"],["Objectif","Promouvoir"],["Vous jouez","les Blancs"],["Difficulté","★★"]],"idea":"Promouvez le pion. Indice : le roi doit passer DEVANT le pion.","theory":"<p>La finale la plus importante des échecs. Tout se résume à un concept : <b>l'opposition</b>.</p> <p><b>Définition.</b> Les deux rois se font face, séparés par une case (une, trois ou cinq — toujours un nombre impair). Celui <em>qui doit jouer</em> perd : il est obligé de céder le passage. Avoir l'opposition = obliger l'autre à bouger en premier.</p> <p><b>La règle d'or.</b> <em>Le roi devant, le pion derrière.</em> Poussez le roi en avant du pion, jamais le pion en premier. Un pion qui court seul est toujours rattrapé.</p> <p><b>Les cases clés.</b> Pour un pion sur la 5e rangée ou moins, les cases clés sont les trois cases situées <em>deux rangées devant lui</em>. Si votre roi atteint une case clé, <b>la promotion est garantie</b>, quoi que fasse l'adversaire. Pour un pion en e2 : les cases clés sont d4, e4 et f4… puis d6/e6/f6 en remontant.</p> <p class='ko'><b>Le piège classique.</b> Ici, <em>1.e4?? est une erreur</em> : le pion se met devant son roi et la position est nulle. Il faut jouer <b>1.Rd4! ou 1.Rf4!</b> (prendre l'opposition en diagonale) et n'avancer le pion qu'ensuite. Le pion est le dernier à bouger, toujours.</p>","steps":["Ne PAS pousser le pion en premier.","Amener le roi devant le pion.","Prendre l'opposition (une case entre les rois, à l'adversaire de jouer).","Atteindre une case clé (2 rangées devant le pion).","Le pion suit et promeut."],"fixnote":"Position corrigée : l'ancienne (Re3/e2 contre Re5) était objectivement NULLE. Ici le gain existe, et seuls les coups de roi le conservent.","src":"github"},{"id":"e-percee","kind":"endgame","tier":2,"side":"w","name":"La percée","sub":"3 pions contre 3 — le sacrifice qui crée une dame","cat":"Finales de pions","fen":"8/ppp5/8/PPP5/8/8/8/k6K w - - 0 1","goal":"line","stats":[["Catégorie","Finales de pions"],["Objectif","Rejouer la technique"],["Vous jouez","les Blancs"],["Difficulté","★★"]],"idea":"Une des plus belles ressources des finales : trois pions face à trois pions, apparemment bloqués. Deux sacrifices créent un pion passé imparable. Ce motif décide des parties entières et presque personne ne le voit.","keys":["Condition : tes pions sont plus AVANCÉS que les siens (ici sur la 5e rangée).","Le sacrifice part TOUJOURS du pion du MILIEU : b6!","Règle d'or : on enchaîne ensuite du côté OPPOSÉ à celui qui a capturé.","Résultat : ton pion extérieur file à dame et le roi est trop loin."],"theory":"","steps":[],"moves":["b6!!","cxb6","a6!","bxa6","c6"],"notes":{"0":"<b>b6!!</b> — Le sacrifice clé, toujours par le pion du milieu. Deux prises sont possibles — ta réponse change selon le côté.","1":"<b>cxb6</b> — Il prend du côté c. Retiens : il faut donc pousser le pion du côté OPPOSÉ.","2":"<b>a6!</b> — Second sacrifice, du côté opposé à sa capture. S'il prend, le pion c file ; s'il refuse, axb7 fait dame.","3":"<b>bxa6</b> — Forcé.","4":"<b>c6</b> — Le pion c court et rien ne l'arrête : plus un seul pion noir sur sa route, et le roi est à l'autre bout de l'échiquier. Dame dans deux coups."},"goaltxt":"Créer un pion passé imparable à partir de rien.","trap":"S'il joue 1...axb6 à la place, la réponse SYMÉTRIQUE est 2.c6! bxc6 3.a6 et c'est le pion a qui passe. Même règle : toujours du côté opposé à sa capture.","src":"hunter"},{"id":"e-carre","kind":"endgame","tier":2,"side":"w","name":"La règle du carré","sub":"Le roi noir peut-il rattraper le pion a ? Comptez, puis poussez.","cat":"Finales de pions","fen":"8/8/8/8/7k/8/P7/6K1 w - - 0 1","goal":"promo","stats":[["Catégorie","Finales de pions"],["Objectif","Promouvoir"],["Vous jouez","les Blancs"],["Difficulté","★★"]],"idea":"Le roi noir peut-il rattraper le pion a ? Comptez, puis poussez.","theory":"<p>Une astuce de calcul mental qui vous évite de compter les coups un par un.</p> <p><b>La règle.</b> Tracez le carré dont un côté va du pion jusqu'à sa case de promotion. Prolongez ce carré latéralement vers le roi adverse. <b>Si le roi adverse est dans le carré (ou peut y entrer au trait), il rattrape le pion. Sinon, le pion promeut.</b></p> <p><b>Le détail qui compte.</b> Si le pion est encore sur sa case de départ (2e rangée), il peut avancer de deux cases : comptez le carré <em>à partir de la 3e rangée</em>. Ici, le pion a2 avance en a4 : le carré est donc a4-d4-d8-a8. Le roi noir est en h4 : très loin du compte. Le pion passe.</p> <p><b>L'usage réel.</b> Cette règle décide des finales : « est-ce que j'échange les dernières pièces ? » Si le carré dit oui, vous foncez en finale de pions gagnée. Elle sert aussi à savoir si vous pouvez vous permettre d'aller croquer un pion à l'autre bout.</p> <p class='ko'>Attention : la règle suppose que le chemin du pion est libre et que rien ne gêne le roi. Un de vos propres pions sur le passage, et le calcul change.</p>","steps":["Repérer la case de promotion du pion.","Tracer le carré (côté = distance pion → promotion).","Le roi adverse est-il dedans ? Non → poussez !","Ne jamais dévier : le pion court tout droit."],"fixnote":"","src":"github"},{"id":"e-mauvaisfou","kind":"endgame","tier":2,"side":"w","name":"Le mauvais fou (nulle à connaître)","sub":"Blancs : fou + pion contre roi nu… et c'est NULLE. Comprenez pourquoi.","cat":"Finales de pièces","fen":"7k/8/5K1P/4B3/8/8/8/8 w - - 0 1","goal":"draw-lesson","stats":[["Catégorie","Finales de pièces"],["Objectif","Comprendre la nulle"],["Vous jouez","les Blancs"],["Difficulté","★★"]],"idea":"Blancs : fou + pion contre roi nu… et c'est NULLE. Comprenez pourquoi.","theory":"<p>Une des rares positions où une pièce et un pion de plus ne gagnent pas. À connaître dans les deux sens : pour ne pas y foncer, et pour s'y réfugier quand on est perdu.</p> <p><b>La condition de nulle</b> : (1) le pion est un pion de <em>tour</em> (colonne a ou h), (2) la case de promotion <em>n'est pas de la couleur du fou</em>, (3) le roi adverse atteint le coin.</p> <p>Ici : le pion h promeut en <b>h8, une case claire</b>. Le fou est <b>sur cases sombres</b>. Il ne pourra donc <em>jamais</em> contrôler h8, ni chasser le roi noir du coin. Le roi noir s'assoit en h8 et ne bouge plus. Si les Blancs poussent h7, c'est <em>pat</em>. S'ils n'avancent pas, il ne se passe rien. Nulle.</p> <p><b>Les conséquences pratiques.</b></p> <ul><li>En attaque : si vous avez cette structure, <em>n'échangez pas</em> vos autres pions — cherchez à garder un deuxième pion, il suffit à gagner.</li> <li>En défense : quand vous êtes perdu avec un fou de la mauvaise couleur en face, <b>courez au coin</b>. C'est une bouée de sauvetage réelle, elle a sauvé des milliers de parties de tournoi.</li></ul> <p class='ok'>Corollaire à retenir : <em>tous les échanges ne se valent pas</em>. Échanger jusqu'à cette position, c'est transformer une victoire en demi-point.</p>","steps":["Identifier la couleur de la case de promotion.","Comparer à la couleur du fou.","Si différente + pion de tour : le roi défenseur court au coin.","Le coin est une forteresse : nulle."],"fixnote":"","src":"github"},{"id":"e-cases-cles","kind":"endgame","tier":2,"side":"w","name":"Les cases clés","sub":"Le roi sur la 6e = gain automatique","cat":"Finales de pions","fen":"4k3/8/4K3/4P3/8/8/8/8 w - - 0 1","goal":"line","stats":[["Catégorie","Finales de pions"],["Objectif","Rejouer la technique"],["Vous jouez","les Blancs"],["Difficulté","★★"]],"idea":"La règle qui transforme les finales de pions en science exacte : si ton roi atteint la 6e rangée DEVANT son pion, avec le pion derrière lui, c'est gagné quel que soit le trait. Plus besoin de calculer l'opposition : tu vises la case clé.","keys":["Pour un pion sur la 5e, les cases clés sont d6, e6, f6 (la 6e rangée devant lui).","Roi sur une case clé = gain automatique, quel que soit celui qui joue.","Corollaire défensif : ton adversaire doit t'EMPÊCHER d'y arriver, sinon il est perdu.","Piège mortel : pousser le pion en e7 avec le roi en e6 = PAT. Le roi doit d'abord aller sur le côté."],"theory":"","steps":[],"moves":["Kf6!","Kd8","Kf7!","Kc7","e6","Kd8","e7+","Kc7","e8=Q"],"notes":{"0":"<b>Kf6!</b> — Le roi contourne par le côté. NE JOUE PAS e6? qui laisse filer le gain, ni ne fonce vers le pat.","2":"<b>Kf7!</b> — Le roi prend le contrôle de e8, la case de promotion. C'est le roi qui ouvre la route.","4":"<b>e6</b> — Le pion avance enfin, entièrement escorté.","6":"<b>e7+</b> — Échec ! Le roi noir doit s'écarter — et surtout, ce n'est PAS pat : le roi blanc est en f7, pas en e6.","8":"<b>e8=Q</b> — Dame. Toute la technique tient en une phrase : le roi d'abord, le pion ensuite."},"goaltxt":"Gain forcé — vérifié par solveur exact.","trap":"","src":"hunter"},{"id":"e-2b","kind":"endgame","tier":2,"side":"w","name":"Mat des deux fous","sub":"Matez avec les deux fous. Il faut chasser le roi dans un COIN.","cat":"Mats élémentaires","fen":"8/8/8/4k3/8/8/8/2B1KB2 w - - 0 1","goal":"mate","stats":[["Catégorie","Mats élémentaires"],["Objectif","Mater"],["Vous jouez","les Blancs"],["Difficulté","★★"]],"idea":"Matez avec les deux fous. Il faut chasser le roi dans un COIN.","theory":"<p>Le mat le plus difficile parmi les « faciles ». Il faut environ 15-18 coups et il y a la règle des 50 coups qui court.</p> <p><b>Trois principes.</b></p> <ul><li><b>Les fous côte à côte.</b> Deux fous placés sur des cases adjacentes en diagonale forment un mur infranchissable de cases contrôlées. Le roi adverse ne peut pas passer au travers.</li> <li><b>Le roi est un partenaire à part entière.</b> Contrairement au mat de la dame, il doit venir juste en face du roi adverse.</li> <li><b>Le mat est <em>dans un coin</em>, n'importe lequel.</b> Contrairement au mat fou+cavalier (où le coin doit être de la couleur du fou), ici tous les coins fonctionnent.</li></ul> <p><b>La méthode.</b> Formez le mur de fous, avancez-le rangée par rangée en gardant les deux fous côte à côte, le roi suit et pousse. Le roi adverse recule inexorablement dans un coin. Le mat final : le roi adverse au coin, votre roi en opposition à saut de cavalier, un fou tient la case de fuite, l'autre donne l'échec.</p> <p class='ko'>Vigilance pat : dans le coin, le roi adverse a très peu de cases. Comptez avant de jouer.</p>","steps":["Fous côte à côte au centre = mur.","Avancer le mur, le roi suit.","Pousser le roi adverse vers un coin (n'importe lequel).","Roi en opposition, un fou coupe la fuite, l'autre mate."],"fixnote":"","src":"github"},{"id":"e-reti","kind":"endgame","tier":3,"side":"w","name":"L'étude de Réti (le chef-d'œuvre)","sub":"Position perdue ? Sauvez la nulle. Le roi blanc semble à des kilomètres.","cat":"Finales de pions","fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1","goal":"draw","stats":[["Catégorie","Finales de pions"],["Objectif","Annuler"],["Vous jouez","les Blancs"],["Difficulté","★★★"]],"idea":"Position perdue ? Sauvez la nulle. Le roi blanc semble à des kilomètres.","theory":"<p>L'étude la plus célèbre de l'histoire (Richard Réti, 1921). Elle paraît absurde : le roi blanc en h8 ne peut <em>évidemment</em> pas rattraper le pion h5, et le pion c6 sera arrêté par le roi noir. Pourtant, c'est nulle.</p> <p><b>Le secret : la géométrie des échecs n'est pas celle du monde réel.</b> Pour un roi, aller de h8 à b8 coûte 6 coups… mais aller de h8 à b8 <em>en passant par g7, f6, e5, d6, c7</em> coûte aussi 6 coups. La diagonale est aussi rapide que la ligne droite. Le roi peut donc courir vers <b>deux objectifs à la fois</b>.</p> <p><b>La solution : 1.Rg7! h4 2.Rf6! Rb6 3.Re5!</b> — et maintenant la double menace éclate :</p> <ul><li>Si 3…h3, alors 4.Rd6! et le pion c passe en dame (le roi noir a perdu le contact).</li> <li>Si 3…Rxc6, alors 4.Rf4! et le roi blanc est <em>rentré dans le carré</em> du pion h : il le rattrape.</li></ul> <p>Le roi ne poursuit pas un but, il en poursuit deux — et il ne peut pas être puni pour les deux.</p> <p class='ok'><b>La leçon à retenir</b> : quand une course de pions semble perdue, cherchez la <em>diagonale à double usage</em>. Le roi est une pièce beaucoup plus rapide qu'il n'en a l'air.</p>","steps":["1.Rg7! — la diagonale vers les deux buts.","2.Rf6! — on menace toujours les deux.","3.Re5! — le point de bifurcation.","3…h3 4.Rd6! (le pion c passe) / 3…Rxc6 4.Rf4! (on rentre dans le carré)."],"fixnote":"","src":"github"},{"id":"e-lucena","kind":"endgame","tier":3,"side":"w","name":"La position de Lucena (le pont)","sub":"Le pion est en c7, le roi devant. Comment gagner malgré les échecs de la tour noire ?","cat":"Finales de tours","fen":"2K5/2P1k3/8/8/8/8/r7/3R4 w - - 0 1","goal":"promo","stats":[["Catégorie","Finales de tours"],["Objectif","Promouvoir"],["Vous jouez","les Blancs"],["Difficulté","★★★"]],"idea":"Le pion est en c7, le roi devant. Comment gagner malgré les échecs de la tour noire ?","theory":"<p><b>La position la plus importante de toutes les finales</b>, parce que les finales de tours sont la moitié des finales de tournoi. Sachez ça et vous gagnerez des points toute votre vie.</p> <p><b>Le problème.</b> Le pion c7 veut promouvoir, mais le roi blanc lui bouche la case c8. Dès qu'il s'écarte, la tour noire vient le mitrailler d'échecs par derrière et le roi ne peut jamais se poser.</p> <p><b>La solution : construire un pont.</b></p> <ul><li><b>1.Td4!!</b> — le coup étrange. La tour se pose sur la <em>4e rangée</em>, apparemment sans raison.</li> <li><b>1…Ta1 2.Rb7 Tb1+ 3.Rc6 Tc1+ 4.Rd5!</b> — le roi marche vers les échecs (il n'a pas peur, il se rapproche de sa tour).</li> <li><b>4…Td1+ 5.Td4!</b> — <em>et voilà le pont</em>. La tour s'interpose et bloque le dernier échec. Elle est protégée par le roi d5. Les échecs sont finis, le pion passe.</li></ul> <p>La tour en d4 avait été placée là <em>exactement</em> pour ce moment, quatre coups à l'avance. C'est pour ça qu'on l'appelle « construire le pont » : on pose la poutre avant de traverser.</p> <p><b>Les deux conditions</b> pour que Lucena marche : (1) le pion est sur la 7e, (2) votre roi est devant lui, (3) le roi adverse est coupé d'au moins une colonne par votre tour. Réunies : gain forcé.</p>","steps":["1.Td4! — poser la poutre du pont sur la 4e rangée.","Marcher le roi VERS les échecs (b7, c6, d5).","À l'échec final : Td4! interpose la tour, protégée par le roi.","Le pion promeut."],"fixnote":"","src":"github"},{"id":"e-philidor","kind":"endgame","tier":3,"side":"b","name":"La position de Philidor (la défense)","sub":"Les Noirs jouent et annulent. Un seul coup sauve : lequel ?","cat":"Finales de tours","fen":"4k3/8/8/4K3/4P3/8/8/r6R b - - 0 1","goal":"draw","stats":[["Catégorie","Finales de tours"],["Objectif","Annuler"],["Vous jouez","les Noirs"],["Difficulté","★★★"]],"idea":"Les Noirs jouent et annulent. Un seul coup sauve : lequel ?","theory":"<p>Le pendant défensif de Lucena. Si Lucena vous fait gagner, <b>Philidor vous fait annuler</b> — et il sauve encore plus de points.</p> <p><b>La règle de la 3e rangée.</b> Tant que le pion adverse n'est pas encore arrivé sur la 6e rangée, mettez votre tour sur <em>votre 3e rangée</em> (la 6e rangée vue des Blancs). Ici : <b>1…Ta6!</b> C'est le seul coup.</p> <p><b>Pourquoi ça marche.</b> La tour en a6 interdit au roi blanc d'entrer sur la 6e rangée. Or, sans son roi devant le pion, les Blancs ne peuvent rien construire. Ils sont bloqués. Ils n'ont qu'un moyen de progresser : pousser le pion en e6.</p> <p><b>Le deuxième temps.</b> Dès que le pion arrive en e6, votre tour part <em>tout au fond</em> : <b>…Ta1!</b> (ou n'importe où sur la 1re rangée). Et maintenant, le roi blanc n'a plus d'abri contre les échecs par derrière : le pion e6 lui bouche lui-même les cases. Échec perpétuel de la tour, <em>nulle</em>.</p> <p class='ko'><b>L'erreur fatale</b> : jouer …Tb1 tout de suite (avant que le pion soit en 6e). Le roi blanc monte alors en e6, et vous êtes dans une position de Lucena perdue. <em>Le timing est tout : 3e rangée d'abord, dernière rangée quand le pion arrive.</em></p>","steps":["Tour sur sa 3e rangée (ici : 1…Ta6!) tant que le pion n'est pas en 6e.","Attendre. Le roi blanc ne peut pas entrer.","Quand le pion arrive en 6e : tour tout au fond (…Ta1!).","Échecs perpétuels par derrière = nulle."],"fixnote":"","src":"github"},{"id":"e-tour-derriere","kind":"endgame","tier":4,"side":"w","name":"Règle de Tarrasch","sub":"La tour va DERRIÈRE le pion passé","cat":"Finales de tours","fen":"2r3k1/8/8/8/P7/8/6K1/7R w - - 0 1","goal":"line","stats":[["Catégorie","Finales de tours"],["Objectif","Rejouer la technique"],["Vous jouez","les Blancs"],["Difficulté","★★★★"]],"idea":"La règle la plus utile des finales de tours, énoncée par Tarrasch : « la tour se place toujours derrière le pion passé » — le tien comme celui de l'adversaire. La raison est géométrique : la tour derrière GAGNE des cases quand le pion avance, la tour devant en PERD.","keys":["Ta tour derrière TON pion : elle le pousse et gagne en liberté à chaque avance.","Ta tour derrière SON pion : elle le bloque et son rayon d'action augmente à mesure qu'il avance.","La tour devant le pion est passive : elle rétrécit à chaque pas. C'est l'erreur classique.","Corollaire : le ROI défenseur doit se placer devant le pion, jamais la tour."],"theory":"","steps":[],"moves":["Ra1!","Ra8","a5","Kf7","a6","Ke7","Kf3","Kd7","Ke4","Kc7","Kd5","Kb8","Kc6"],"notes":{"0":"<b>Ra1!</b> — La tour se place DERRIÈRE le pion. Elle le soutiendra sur toute sa course sans jamais le gêner.","1":"<b>Ra8</b> — Les Noirs sont OBLIGÉS de bloquer devant le pion — leur tour devient totalement passive. Compare les deux tours : tout est là.","2":"<b>a5</b> — Le pion avance et la tour a1 garde toute sa mobilité.","4":"<b>a6</b> — À chaque pas, ta tour reste active et la sienne est de plus en plus prisonnière.","6":"<b>Kf3</b> — Le roi vient aider : les finales de tours se gagnent avec le roi actif.","10":"<b>Kd5</b> — Le roi arrive à la rescousse du pion, pendant que la tour noire reste clouée à la case a8.","12":"<b>Kc6</b> — Position gagnante : le roi soutient le pion, la tour a1 a tout fait depuis l'arrière. La tour noire n'a jamais joué le moindre rôle."},"goaltxt":"Intégrer un réflexe permanent : tour DERRIÈRE le pion passé.","trap":"","src":"hunter"},{"id":"t-t4","kind":"tactic","tier":1,"side":"w","name":"La fourchette (famille)","sub":"","fen":"r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1","sol":["Nc7+"],"mate":false,"hint":"","text":"<b>La fourchette de cavalier</b> : une seule pièce attaque deux cibles à la fois. Comme le roi doit obligatoirement répondre à l'échec, l'autre pièce est perdue.<br><br>Ici <code>Cc7+</code> attaque le roi e8 <em>et</em> la tour a8. Quand la fourchette touche le roi et la dame, on l'appelle la <b>fourchette royale</b> ; quand elle touche roi + dame + tour, c'est la <b>fourchette familiale</b>.<br><br><em>Pourquoi le cavalier ?</em> Parce qu'il est la seule pièce qui attaque sans être sur la ligne de sa cible : on ne peut ni s'interposer, ni le bloquer. La seule parade est de le prendre ou de bouger.<br><br><b>Le réflexe à installer</b> : à chaque coup de l'adversaire, regardez toutes les cases où un cavalier pourrait sauter en touchant deux de vos pièces. La grande majorité des pièces perdues en dessous de 1600 Elo le sont sur une fourchette de cavalier non vue.","stats":[["Motif","La fourchette (famille)"],["Type","Gain de matériel"],["Solution","1 coup"],["Difficulté","★"]],"fixnote":"","src":"github"},{"id":"t-t7","kind":"tactic","tier":1,"side":"w","name":"Le clouage absolu","sub":"","fen":"4k3/8/2n5/1B6/3P4/8/8/4K3 w - - 0 1","sol":["d5"],"mate":false,"hint":"","text":"<b>Le clouage absolu</b> : le fou b5 tient la diagonale b5-c6-d7-e8. Le cavalier c6 ne peut <em>légalement pas</em> bouger, puisque cela exposerait son roi — c'est un clouage absolu (par opposition au clouage relatif, où la pièce derrière est simplement une pièce de valeur).<br><br><b>La technique universelle</b> : une pièce clouée est un objet immobile. Ne la prenez pas tout de suite — <em>attaquez-la une fois de plus</em>, de préférence avec un pion (la pièce la moins chère). Ici <code>d5!</code> et le cavalier est attaqué deux fois, défendu zéro fois, et incapable de fuir.<br><br>C'est exactement l'idée derrière l'Espagnole (Fb5) et derrière tous les Fg5 qui clouent un cavalier f6 : <em>on cloue, puis on empile.</em>","stats":[["Motif","Le clouage absolu"],["Type","Gain de matériel"],["Solution","1 coup"],["Difficulté","★"]],"fixnote":"","src":"github"},{"id":"t-t1","kind":"tactic","tier":1,"side":"w","name":"Mat du couloir","sub":"Le roi noir est enfermé par ses propres pions.","fen":"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1","sol":["Ra8#"],"mate":true,"hint":"Le roi noir est enfermé par ses propres pions.","text":"<b>Mat du couloir</b> (ou mat du corridor) : le roi est étouffé par sa propre rangée de pions, et une tour ou une dame le balaie sur la dernière rangée. <em>C'est la tactique la plus fréquente de tous les échecs.</em><br><br>La prophylaxie : jouez <code>h6</code> ou <code>g6</code> à un moment tranquille pour offrir une « case d'air » à votre roi. Réciproquement, dès que l'adversaire a ses trois pions intacts devant son roi et que sa dernière rangée n'est plus défendue, <b>regardez le couloir</b> : des dizaines de combinaisons (déviations, sacrifices de dame) n'ont pas d'autre but que de vider cette rangée.","stats":[["Motif","Mat du couloir"],["Type","Mat forcé"],["Solution","1 coup"],["Difficulté","★"]],"fixnote":"","src":"github"},{"id":"t-t6","kind":"tactic","tier":2,"side":"w","name":"L'attraction (attirer le roi)","sub":"Une pièce défend l'autre sur la grande diagonale.","fen":"7k/6pp/8/4Q3/8/8/1B6/6K1 w - - 0 1","sol":["Qxg7#"],"mate":true,"hint":"Une pièce défend l'autre sur la grande diagonale.","text":"<b>Le sacrifice qui n'en est pas un</b> : <code>Dxg7#</code> semble donner la dame, mais le fou b2 la défend à travers la grande diagonale a1-h8 (qui se libère au moment même où la dame quitte e5).<br><br>C'est le motif <b>dame + fou sur la grande diagonale</b> — probablement la batterie la plus meurtrière du jeu. Elle apparaît dans le fianchetto (Fg2/Fb2), dans l'attaque contre le roque, dans la Sicilienne, partout.<br><br><em>Le réflexe :</em> chaque fois que votre fou tient une grande diagonale pointée sur le roque adverse, cherchez ce qui bouche le chemin — c'est presque toujours <b>là</b> qu'est le sacrifice. Un cavalier en f6 ? Un pion en g7 ? Trouvez le moyen de le faire disparaître, avec une dame qui suit derrière.","stats":[["Motif","L'attraction (attirer le roi)"],["Type","Mat forcé"],["Solution","1 coup"],["Difficulté","★★"]],"fixnote":"","src":"github"},{"id":"t-t5","kind":"tactic","tier":2,"side":"w","name":"L'enfilade (rayon X)","sub":"","fen":"q7/1k6/8/8/2B5/8/8/6K1 w - - 0 1","sol":["Bd5+"],"mate":false,"hint":"","text":"<b>L'enfilade</b> (ou attaque en rayon X) : le contraire exact du clouage. Dans un clouage, la pièce de <em>faible</em> valeur est devant. Dans une enfilade, c'est la pièce de <em>forte</em> valeur qui est devant — donc elle est obligée de bouger, et ce qu'elle protégeait tombe.<br><br>Ici <code>Fd5+</code> : le roi b7 est en échec sur la diagonale, il doit s'écarter, et le fou prend la dame a8.<br><br><em>Le signal :</em> deux pièces adverses alignées sur une diagonale, une colonne ou une rangée, avec la plus chère devant. Cherchez la pièce à longue portée (fou, tour, dame) qui peut se poser sur cette ligne <b>avec échec</b>. L'échec est la clé : sans lui, l'adversaire a le temps de défendre.","stats":[["Motif","L'enfilade (rayon X)"],["Type","Gain de matériel"],["Solution","1 coup"],["Difficulté","★★"]],"fixnote":"","src":"github"},{"id":"t-t8","kind":"tactic","tier":2,"side":"w","name":"L'échec à la découverte","sub":"","fen":"3k4/8/8/3N3q/8/8/8/3RK3 w - - 0 1","sol":["Nf4+"],"mate":false,"hint":"","text":"<b>L'échec à la découverte</b> : la tactique la plus violente du jeu, parce qu'elle attaque avec <em>deux pièces en un seul coup</em>.<br><br>Le cavalier d5 bouche la colonne d. Dès qu'il s'écarte, la tour d1 fait échec au roi d8. Et comme l'adversaire est <b>obligé</b> de répondre à l'échec, le cavalier peut aller se servir n'importe où en toute impunité : <code>Cf4+!</code> attrape la dame h5.<br><br><em>Le signal à chercher :</em> une de vos pièces à longue portée alignée sur le roi adverse, avec l'une de vos propres pièces au milieu. Cette pièce du milieu devient une <b>arme libre</b> — elle peut tout se permettre pendant un coup. La variante extrême est le <b>double échec</b> (les deux pièces font échec en même temps) : là, seul le déplacement du roi est possible, même prendre est interdit.","stats":[["Motif","L'échec à la découverte"],["Type","Gain de matériel"],["Solution","1 coup"],["Difficulté","★★"]],"fixnote":"","src":"github"},{"id":"t-t9","kind":"tactic","tier":2,"side":"w","name":"Mat arabe (tour + cavalier)","sub":"Le cavalier protège la case d'arrivée de la tour.","fen":"7k/R7/5N2/8/8/8/8/6K1 w - - 0 1","sol":["Rh7#"],"mate":true,"hint":"Le cavalier protège la case d'arrivée de la tour.","text":"<b>Le mat arabe</b>, le plus vieux mat référencé de l'histoire du jeu (les manuscrits arabes du IXe siècle).<br><br>La coopération est parfaite : <code>Th7#</code> semble absurde (la tour se met au contact du roi), mais <b>le cavalier f6 la défend</b>. Et ce même cavalier couvre g8. La tour, elle, balaie toute la 7e rangée, donc g7 est interdit. Le roi n'a plus une seule case.<br><br><em>Le duo tour + cavalier</em> est le plus dangereux du jeu contre un roi au coin : le cavalier couvre les cases que la tour ne peut pas atteindre (les diagonales), la tour couvre les lignes. Retenez la géométrie : <b>cavalier en f6, tour en h7, roi en h8</b>. Elle revient sans arrêt.","stats":[["Motif","Mat arabe (tour + cavalier)"],["Type","Mat forcé"],["Solution","1 coup"],["Difficulté","★★"]],"fixnote":"Position corrigée : la tour partait de h1, où elle faisait déjà échec — la position ne pouvait pas exister.","src":"github"},{"id":"t-t3","kind":"tactic","tier":2,"side":"w","name":"Mat d'Anastasie","sub":"Le cavalier tient déjà les cases de fuite. Amenez la tour.","fen":"8/4N1pk/8/8/R7/8/8/6K1 w - - 0 1","sol":["Rh4#"],"mate":true,"hint":"Le cavalier tient déjà les cases de fuite. Amenez la tour.","text":"<b>Le mat d'Anastasie</b> : la coopération cavalier + tour. Le cavalier en e7 contrôle <em>à lui seul</em> g8 et g6, les deux cases de fuite latérales. Le pion g7 bloque le roi. Il ne reste que la colonne h — la tour arrive : <code>Th4#</code>.<br><br>Dans une vraie partie, ce mat arrive presque toujours après un sacrifice pour ouvrir la colonne h : typiquement <code>Cxe7+</code> puis <code>Dxh7+!! Rxh7</code> et <code>Th3#</code>. <br><br><em>Le motif à mémoriser</em> : cavalier en e7 (ou e2 en miroir) + roi en h7 + une pièce lourde qui accède à la colonne h. Cherchez-le à chaque fois que votre cavalier atterrit en e7.","stats":[["Motif","Mat d'Anastasie"],["Type","Mat forcé"],["Solution","1 coup"],["Difficulté","★★"]],"fixnote":"","src":"github"},{"id":"t-deviation","kind":"tactic","tier":3,"side":"w","name":"La déviation","sub":"Chasser le défenseur","fen":"3rr1k1/5ppp/8/8/4Q3/8/5PPP/4R1K1 w - - 0 1","sol":[],"mate":true,"hint":"","text":"Toute pièce défendue l'est par un DÉFENSEUR. Détruis-le, dévie-le ou surcharge-le, et la cible tombe. La déviation transforme une position solide en effondrement immédiat.","keys":["Repère la pièce clé de sa DÉFENSE, pas la pièce que tu veux prendre.","Trois manières : capturer le défenseur, le dévier ailleurs, ou le SURCHARGER (deux tâches à la fois).","Une pièce qui défend deux choses est surchargée : c'est ta cible prioritaire.","Le mat du couloir naît presque toujours d'une déviation."],"moves":["Qxe8+!!","Rxe8","Rxe8#"],"notes":{"0":"<b>Qxe8+!!</b> — Sacrifice de dame ! Tu DÉVIES la tour d8 : elle est le seul défenseur du couloir.","1":"<b>Rxe8</b> — Forcé — il doit reprendre.","2":"<b>Rxe8#</b> — MAT DU COULOIR. Le roi est étouffé par ses propres pions f7-g7-h7. La dame sacrifiée a détruit le seul défenseur de la 8e rangée."},"stats":[["Motif","La déviation"],["Type","Démonstration commentée"],["Vous jouez","les Blancs"],["Difficulté","★★★"]],"goaltxt":"Mat par destruction du défenseur.","src":"hunter"},{"id":"t-t2","kind":"tactic","tier":3,"side":"w","name":"Mat étouffé (Philidor)","sub":"Un sacrifice de dame pour boucher la dernière case du roi.","fen":"5r1k/6pp/8/6N1/8/1Q6/8/6K1 w - - 0 1","sol":["Nf7+","Kg8","Nh6+","Kh8","Qg8+","Rxg8","Nf7#"],"mate":true,"hint":"Un sacrifice de dame pour boucher la dernière case du roi.","text":"<b>Le mat étouffé</b>, le plus élégant de tous. Le roi est mat par un cavalier parce que ses propres pièces l'enferment.<br><br>La mécanique est toujours la même :<br>1) <code>Cf7+</code> — échec (le cavalier est protégé par la dame b3 sur la diagonale b3-g8).<br>2) <code>Ch6+</code> — <em>double échec !</em> Le roi est obligé de bouger, il ne peut ni parer ni prendre.<br>3) <code>Dg8+!!</code> — le sacrifice de dame. Génial parce qu'il est <em>forcé</em> : la tour f8 doit prendre.<br>4) <code>Cf7#</code> — la tour a bouché elle-même la dernière case de fuite du roi. Étouffé.<br><br><em>Le signal à repérer :</em> un roi en h8 avec une tour en f8 et des pions g7/h7 intacts + votre cavalier près de g5 + votre dame sur la diagonale a2-g8. Dès que ces trois éléments sont réunis, cherchez ce mat.","stats":[["Motif","Mat étouffé (Philidor)"],["Type","Mat forcé"],["Solution","7 coups"],["Difficulté","★★★"]],"fixnote":"","src":"github"},{"id":"t-zwischenzug","kind":"tactic","tier":4,"side":"b","name":"Le zwischenzug","sub":"Le coup intermédiaire qui change tout","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","sol":[],"mate":false,"hint":"","text":"Le motif que les joueurs de club ne voient jamais. Au lieu de reprendre « automatiquement », tu insères un coup intermédiaire AVEC MENACE. L'adversaire doit y répondre — et tu reprends ensuite avec un temps gratuit en poche.","keys":["Réflexe fatal : reprendre automatiquement. Cherche TOUJOURS mieux d'abord.","Le zwischenzug doit être plus FORT que la menace en cours : échec, attaque de dame, mat.","La question à se poser à chaque échange : « ai-je un coup plus fort AVANT de reprendre ? »","Symétrique : cherche aussi le zwischenzug de l'ADVERSAIRE. C'est là que les calculs s'écroulent."],"moves":["e4","e5","Nf3","Nc6","d4","exd4","Nxd4","Bc5","Nxc6","Qf6!!","Qd2","Qxc6"],"notes":{"4":"<b>d4</b> — L'Écossaise : les Blancs ouvrent le centre.","7":"<b>Bc5</b> — Tu développes en attaquant le cavalier d4.","8":"<b>Nxc6</b> — Les Blancs prennent ton cavalier. Le réflexe automatique serait 5...bxc6 — qui te donne des pions doublés.","9":"<b>Qf6!!</b> — LE ZWISCHENZUG. Au lieu de reprendre, tu crées DEUX menaces : Dxf2+ et Dxc6. Le cavalier c6 ne peut pas s'enfuir en défendant f2.","10":"<b>Qd2</b> — Les Blancs doivent parer — et pendant ce temps, leur cavalier reste en prise.","11":"<b>Qxc6</b> — Tu reprends la pièce MAINTENANT, avec une structure de pions intacte. Le coup intermédiaire t'a évité les pions doublés : un temps bien investi vaut souvent une pièce."},"stats":[["Motif","Le zwischenzug"],["Type","Démonstration commentée"],["Vous jouez","les Noirs"],["Difficulté","★★★★"]],"goaltxt":"Gagner un temps décisif par un coup intermédiaire.","src":"hunter"},{"id":"t-moulin","kind":"tactic","tier":5,"side":"w","name":"Le moulin","sub":"La machine à dévorer","fen":"6k1/pp3pp1/5B2/7q/8/6R1/5PPP/6K1 w - - 0 1","sol":[],"mate":false,"hint":"","text":"Le motif le plus spectaculaire du jeu (Torre–Lasker, 1925). Une tour et un fou forment une machine : échec à la découverte, la tour ramasse une pièce, retour, échec à la découverte, elle ramasse encore... Le roi est impuissant, coup après coup.","keys":["Ingrédients : un fou qui vise le roi À TRAVERS une tour, et un roi sans case de fuite.","Chaque échec à la découverte force le roi à revenir sur la même case : le cycle recommence.","La tour se sert au passage à chaque tour de moulin : c'est une rafle méthodique.","Torre a ainsi dévoré la position de Lasker, champion du monde en titre."],"moves":["Rxg7+!!","Kh8","Rxf7+","Kg8","Rg7+","Kh8","Rxb7+","Kg8","Rg7+","Kh8","Rg5+","Kh7","Rxh5"],"notes":{"0":"<b>Rxg7+!!</b> — Le moulin démarre. Le roi ne peut pas prendre : g7 est protégé par le fou f6.","1":"<b>Kh8</b> — Forcé.","2":"<b>Rxf7+</b> — ÉCHEC À LA DÉCOUVERTE : la tour s'écarte de g7 et le fou f6 frappe le roi. Un pion au passage.","3":"<b>Kg8</b> — Forcé, encore.","4":"<b>Rg7+</b> — La tour revient avec échec : le roi doit retourner en h8. Le moulin tourne.","6":"<b>Rxb7+</b> — Et la tour se sert ! Encore une pièce dévorée, toujours avec échec à la découverte.","8":"<b>Rg7+</b> — Encore un tour de moulin.","10":"<b>Rg5+</b> — Le moulin s'arrête : la tour revient avec échec à la découverte et se place en g5...","12":"<b>Rxh5</b> — ...où elle ramasse la DAME. Le roi noir n'a pas pu faire un seul coup utile de toute la séquence."},"stats":[["Motif","Le moulin"],["Type","Démonstration commentée"],["Vous jouez","les Blancs"],["Difficulté","★★★★★"]],"goaltxt":"Rafle méthodique par échecs à la découverte.","src":"hunter"}],"principles":[{"t":"Les 3 règles de l'ouverture","c":"<p>Tout le début de partie tient en trois phrases. Si vous ne retenez que ça, vous jouerez déjà mieux que la majorité des joueurs de club.</p><ul><li><b>1. Occupez le centre.</b> Une pièce au centre contrôle plus de cases : un cavalier en e5 vise 8 cases, en a1 il en vise 2. Poussez <em>un</em> pion central (e4 ou d4), rarement les deux d'un coup.</li><li><b>2. Développez toutes vos pièces, une seule fois chacune.</b> Cavaliers d'abord (ils savent où aller), fous ensuite. Ne rejouez pas la même pièce deux fois dans l'ouverture sans raison impérieuse : chaque temps perdu est une pièce adverse qui sort à votre place.</li><li><b>3. Roquez tôt.</b> Avant le 10e coup, presque toujours. Le roi est en sécurité <em>et</em> la tour rejoint le centre. Deux bénéfices pour un coup.</li></ul><p class='ko'><b>Le corollaire :</b> ne sortez pas la dame tôt. Elle se fait chasser par des pièces mineures, et chaque fois qu'elle fuit, l'adversaire développe gratuitement. Une dame sortie au 3e coup, c'est trois temps offerts.</p>"},{"t":"La valeur des pièces (et pourquoi elle ment)","c":"<p>Le barème classique : <em>pion = 1, cavalier = 3, fou = 3, tour = 5, dame = 9</em>. Le roi n'a pas de valeur (il est le jeu lui-même), mais il vaut environ 4 en attaque, en finale.</p><p><b>Ce que le barème ne dit pas :</b></p><ul><li><b>La paire de fous vaut plus que la somme des fous.</b> Deux fous couvrent les deux couleurs de cases : ensemble, ils valent environ un demi-pion de plus que fou + cavalier. Bobby Fischer gagnait des finales entières avec ça.</li><li><b>Le fou aime les positions ouvertes, le cavalier les positions fermées.</b> Dans une position bloquée, un cavalier vaut nettement plus qu'un fou coincé derrière ses pions. Regardez la structure avant d'échanger.</li><li><b>Une tour ne vaut rien avant l'ouverture d'une colonne.</b> C'est la pièce la plus lente à activer, et la plus forte une fois activée.</li><li><b>Un pion passé en finale peut valoir une tour.</b> La valeur d'un pion croît avec le nombre de rangées franchies.</li></ul><p>Le barème sert à calculer les échanges en une seconde. Le reste est du jugement.</p>"},{"t":"Structure de pions : le squelette","c":"<p>Philidor : « <em>les pions sont l'âme des échecs</em> ». Les pièces bougent, les pions restent — ils décident donc où se jouera la partie, pour vingt coups.</p><ul><li><b>Pion isolé</b> : aucun pion ami sur les colonnes voisines. Il ne peut jamais être défendu par un pion. Faible en finale, mais il donne de l'espace et des cases actives au milieu de jeu.</li><li><b>Pions doublés</b> : deux pions sur la même colonne. Ils ne peuvent pas se défendre entre eux et l'un des deux est souvent condamné. En échange : ils ouvrent une colonne pour vos tours.</li><li><b>Pion arriéré</b> : en retard sur ses voisins, il ne peut plus avancer sans tomber. C'est une cible permanente, et la case devant lui est un <em>trou</em>.</li><li><b>Pion passé</b> : plus aucun pion adverse devant lui ni sur les colonnes voisines. En finale, c'est de l'or. « <em>Un pion passé doit être poussé</em> » (Nimzowitsch), ou bloqué s'il est adverse — de préférence par un cavalier.</li><li><b>Chaîne de pions</b> : une diagonale de pions qui se défendent. Règle absolue : <em>elle s'attaque toujours à sa base</em>, jamais à sa tête (la tête est défendue, la base ne l'est pas).</li></ul><p class='ok'><b>Avant chaque échange, demandez-vous : « quelle structure ça me laisse ? »</b> Une structure saine gagne les finales toute seule.</p>"},{"t":"Le plan : comment savoir quoi jouer","c":"<p>La question de tout joueur bloqué : « je ne sais pas quoi faire ». La réponse est une méthode, pas du talent.</p><p><b>Étape 1 — Faire l'inventaire</b> (30 secondes, honnêtement) :</p><ul><li>Qui a le meilleur roi (sécurité) ?</li><li>Qui a la meilleure structure de pions ?</li><li>Y a-t-il une colonne ouverte ou semi-ouverte ? Qui peut la prendre ?</li><li>Quelle est ma pire pièce ? Quelle est la sienne ?</li><li>Y a-t-il des cases faibles (trous) dans son camp ? Puis-je y poser un cavalier ?</li></ul><p><b>Étape 2 — Le plan découle de l'inventaire.</b> Vous n'inventez rien, vous <em>lisez</em> la position :</p><ul><li>Colonne ouverte → doublez les tours dessus.</li><li>Trou dans son camp → installez-y un cavalier, soutenu par un pion.</li><li>Sa pire pièce est enfermée → évitez les échanges, jouez à une pièce de plus.</li><li>Majorité de pions sur une aile → poussez-la, créez un passé.</li><li>Son roi est mal → ouvrez les lignes vers lui, même au prix d'un pion.</li></ul><p><b>Étape 3 — La pièce la plus mauvaise.</b> S'il n'y a rien d'autre : <em>trouvez votre pire pièce et améliorez-la</em>. C'est la règle de Makogonov, et c'est le meilleur conseil « quand on ne sait pas quoi jouer » jamais donné.</p>"},{"t":"La règle du candidat (arrêter les gaffes)","c":"<p>En dessous de 1800 Elo, <b>99 % des parties se décident sur une gaffe</b>, pas sur un plan. Aucune ouverture ne compensera un cavalier laissé en prise. La bonne nouvelle : c'est réparable par une discipline, pas par du travail.</p><p><b>Le protocole en 3 questions, à chaque coup, sans exception</b> — y compris quand le coup semble évident (surtout quand il semble évident) :</p><ul><li><b>1. Après le coup de l'adversaire : qu'est-ce qui a changé ?</b> Quelle case attaque-t-il maintenant qu'il n'attaquait pas avant ? Regardez toute la ligne de la pièce qui vient de bouger, jusqu'au bord.</li><li><b>2. Toutes ses menaces :</b> échecs, prises, coups qui attaquent une pièce. Dans cet ordre. <em>Échecs. Prises. Menaces.</em></li><li><b>3. Avant de poser ma pièce : est-elle en prise ? Est-ce que je laisse quelque chose en prise derrière ?</b></li></ul><p class='ok'><b>Le geste physique qui marche :</b> choisissez votre coup, puis <em>gardez la main sur la pièce</em> et regardez l'échiquier une dernière fois comme si c'était le coup de l'adversaire. Ce demi-seconde d'audit vaut 200 points Elo. Ce n'est pas une image : c'est mesuré.</p>"},{"t":"Les 4 phases d'une attaque sur le roque","c":"<p>Attaquer n'est pas « foncer ». C'est une procédure.</p><ul><li><b>1. Le droit d'attaquer.</b> On n'attaque que si l'on a un avantage quelque part : plus de pièces sur l'aile, un centre fermé (donc il ne peut pas contre-attaquer au milieu), ou une structure affaiblie en face. <em>Attaquer sans droit, c'est se suicider.</em> (Règle de Steinitz.)</li><li><b>2. Amener les troupes.</b> Comptez les attaquants et les défenseurs autour du roi adverse. Il vous faut <b>un attaquant de plus</b> que lui de défenseurs. Amenez la dernière pièce (souvent une tour par Te1-e3-h3, ou le cavalier vers f5/g5) <em>avant</em> de frapper.</li><li><b>3. Ouvrir une ligne.</b> Un roi derrière trois pions intacts est imprenable. Il faut casser : h4-h5xg6, ou un sacrifice sur h7/f7/g7. Le sacrifice n'est pas de la magie, c'est un <em>ouvre-boîte</em>.</li><li><b>4. Le mat.</b> Là seulement, le calcul concret prend le relais.</li></ul><p class='ko'><b>L'erreur n°1 :</b> attaquer avec deux pièces. Ça ne marche jamais. La dame toute seule ne mate personne : elle a besoin d'un fou, d'un cavalier ou d'une tour à côté d'elle.</p>"},{"t":"Le milieu de jeu en finale : quand échanger","c":"<p>Chaque échange est une décision stratégique, jamais un réflexe.</p><ul><li><b>Vous avez du matériel en plus → échangez les pièces, pas les pions.</b> Moins il reste de pièces, plus votre avantage matériel pèse. Mais gardez des pions : sans pions, on ne mate pas (voir le mauvais fou).</li><li><b>Vous avez du matériel en moins → échangez les pions, pas les pièces.</b> Vous cherchez la finale nulle : moins de pions = plus de chances de forteresse ou de pat.</li><li><b>Vous êtes à l'étroit (moins d'espace) → échangez.</b> Chaque pièce échangée donne de l'air aux autres. Réciproquement, quand vous avez l'espace, <em>gardez les pièces sur l'échiquier</em> : c'est lui qui étouffe.</li><li><b>Échangez votre mauvaise pièce contre sa bonne pièce.</b> Toujours. C'est le meilleur échange qui existe et il ne coûte rien.</li><li><b>Échangez ses défenseurs.</b> Le cavalier f6 est le meilleur défenseur du roque noir : l'échanger vaut souvent un demi-pion et une attaque.</li></ul>"},{"t":"Le temps : gérer sa pendule","c":"<p>Un plan parfait joué en zeitnot est une partie perdue. La gestion du temps est une compétence à part.</p><ul><li><b>Jouez vite les coups théoriques et les reprises forcées.</b> Ne réfléchissez pas 5 minutes sur un coup où vous n'avez qu'une réponse.</li><li><b>Investissez le temps aux moments critiques :</b> quand la structure de pions va changer définitivement, quand il faut choisir un plan, quand il y a un sacrifice possible. Ces moments sont rares — 4 ou 5 par partie.</li><li><b>La règle du dernier tiers :</b> gardez toujours de quoi jouer les 10 derniers coups. La plupart des parties se perdent après le coup 30, quand les deux joueurs sont fatigués.</li><li><b>Après une longue réflexion, vérifiez la gaffe une fois de plus.</b> Le pic statistique de gaffes se situe <em>juste après</em> un coup longuement réfléchi : on est tellement content de son idée qu'on oublie de regarder la réponse.</li></ul>"}]};

const byId = id => CARDS.find(c => c.id === id);

/* ---------------- progression ---------------- */
const KEY = 'echecs_hunter_v2';
const RANKS = [[1,'E'],[4,'D'],[8,'C'],[13,'B'],[19,'A'],[26,'S']];
const RANK_NAME = {E:'Novice',D:'Écuyer',C:'Tacticien',B:'Stratège',A:'Maître d\'armes',S:'Monarque'};
const RANK_TINT = {E:'#8d7a56',D:'#6f8f57',C:'#5c7fa6',B:'#8a6aa8',A:'#a2762f',S:'#9c4f42'};
const TIER_NAME = {1:'Fondations',2:'Apprentissage',3:'Compréhension',4:'Avancé',5:'Maîtrise'};
const KIND = {
  opening:{n:'Ouverture', pl:'Ouvertures', ic:'♟', tint:'#e4ecd8'},
  endgame:{n:'Finale',    pl:'Finales',    ic:'♔', tint:'#dbe6f0'},
  tactic: {n:'Tactique',  pl:'Tactiques',  ic:'⚔', tint:'#f2dede'}
};
const SRS = [0,1,3,7,16,35], MAXBOX = 5;
const XPV = {study:15, drill:60, trap:20, tac:25, endWin:80, line:45, princ:10, elo:15, game:[40,90,150]};

const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d) };
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/864e5);

function fresh(){ return {xp:0, items:{}, elo:[], streak:0, lastDay:null, days:{}, theme:'light', games:{w:0,d:0,l:0}, born:today()} }
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(fresh(), JSON.parse(r)) }catch(e){} return fresh() }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
function rec(id){ if(!S.items[id]) S.items[id] = {box:0, ok:0, ko:0, next:null, seen:0}; return S.items[id] }

const levelOf = xp => { let l = 1; while(l < 40 && xp >= xpFor(l+1)) l++; return l };
const xpFor = l => Math.round(90*(l-1) + 26*Math.pow(l-1, 1.72));
const rankOf = l => { let r = 'E'; for(const [n,x] of RANKS) if(l >= n) r = x; return r };
const stars = id => { const b = rec(id).box; return b>=4?3 : b>=2?2 : b>=1?1 : 0 };
const mastered = id => rec(id).box >= 2;
const isDue = id => { const o = S.items[id]; return !!(o && o.next && dayDiff(o.next, today()) >= 0) };
const isNew = id => !S.items[id] || S.items[id].box === 0;

function tierOpen(t){
  if(t <= 1) return true;
  if(!tierOpen(t-1)) return false;
  const prev = CARDS.filter(c => c.tier === t-1);
  return !prev.length || prev.filter(c => mastered(c.id)).length / prev.length >= 0.7;
}
const maxTier = () => { let m = 1; for(let t = 1; t <= 5; t++) if(tierOpen(t)) m = t; return m };
const dueList = () => CARDS.filter(c => tierOpen(c.tier) && isDue(c.id))
  .sort((a,b) => rec(a.id).box - rec(b.id).box || a.tier - b.tier);

function gainXP(n, why){
  const before = levelOf(S.xp);
  S.xp += n; S.days[today()] = (S.days[today()]||0) + n;
  const t = today();
  if(S.lastDay !== t){ S.streak = (S.lastDay && dayDiff(S.lastDay,t) === 1) ? S.streak+1 : 1; S.lastDay = t }
  save();
  toast(`<b>+${n} XP</b>${why ? ' · ' + why : ''}`);
  const after = levelOf(S.xp);
  if(after > before){
    const r = rankOf(after);
    setTimeout(() => toast(`<b style="font-size:19px">Niveau ${after}</b><br>Rang ${r} — ${RANK_NAME[r]}`, 4200), 700);
  }
  paintHead();
}
/** Met à jour la mémorisation espacée d'une fiche. */
function grade(id, good){
  const o = rec(id); o.seen++;
  if(good){ o.ok++; o.box = Math.min(MAXBOX, o.box+1) } else { o.ko++; o.box = Math.max(0, o.box-1) }
  o.next = addDays(today(), SRS[Math.min(o.box, MAXBOX)]);
  save();
}

/* ---------------- utilitaires d'interface ---------------- */
function toast(html, ms){
  const d = document.createElement('div');
  d.className = 'tst'; d.innerHTML = html;
  $('#toast').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .4s'; setTimeout(() => d.remove(), 420) }, ms || 2600);
}
const starHTML = n => `<span class="stars">${'★'.repeat(n)}<span class="e">${'★'.repeat(3-n)}</span></span>`;
function leaders(rows){
  return `<ul class="leaders">${rows.map(([k,v]) =>
    `<li><span class="k">${esc(k)}</span><span class="d"></span><span class="v">${esc(v)}</span></li>`).join('')}</ul>`;
}
function orbs(c){

  return `<div class="orbs">
    <div class="orb" style="--tint:${K.tint}" data-tip="${K.n}">${K.ic}</div>

    <div class="orb" style="--tint:${c.side === 'w' ? '#f7f2e4' : '#d9d0bd'}" data-tip="${c.side === 'w' ? 'Vous jouez les Blancs' : 'Vous jouez les Noirs'}">${c.side === 'w' ? '♙' : '♟'}</div>
  </div>`;
}

/* ==========================================================
   ÉCHIQUIER
   ========================================================== */
/* Glyphes PLEINS pour les deux camps (les glyphes évidés ♔♕ rendent mal
   selon les polices) : la couleur seule distingue les camps.
   \uFE0E force le rendu texte et empêche la substitution en emoji. */
const V='\uFE0E';
const GLYPH = {K:'♚'+V,Q:'♛'+V,R:'♜'+V,B:'♝'+V,N:'♞'+V,P:'♟'+V,
               k:'♚'+V,q:'♛'+V,r:'♜'+V,b:'♝'+V,n:'♞'+V,p:'♟'+V};
function Board(host, opt){
  const B = {
    pos: parseFEN(opt.fen || START), flip: !!opt.flip, sel: -1, targets: [],
    last: null, locked: false, hint: null, onMove: opt.onMove || (() => {})
  };
  B.set = fen => { B.pos = parseFEN(fen); B.sel = -1; B.targets = []; B.last = null; B.draw() };
  B.setPos = p => { B.pos = p; B.sel = -1; B.targets = []; B.draw() };
  B.draw = () => {
    const idx = [...Array(64).keys()], order = B.flip ? idx.reverse() : idx;
    host.innerHTML = order.map(i => {
      const r = i >> 3, c = i & 7, pc = B.pos.b[i];
      const cl = ['sq', (r+c) % 2 ? 'd' : 'l'];
      if(B.sel === i) cl.push('sel');
      if(B.last && (B.last.from === i || B.last.to === i)) cl.push('last');
      if(B.hint && B.hint.includes(i)) cl.push('hint');
      const t = B.targets.find(m => m.to === i);
      const mark = t ? (pc ? '<span class="ring"></span>' : '<span class="dot"></span>') : '';
      const f = FILES[c], rank = 8 - r;
      const coF = (B.flip ? r === 0 : r === 7) ? `<span class="co f">${f}</span>` : '';
      const coR = (B.flip ? c === 7 : c === 0) ? `<span class="co r">${rank}</span>` : '';
      return `<div class="${cl.join(' ')}" data-i="${i}">${mark}${pc ? `<span class="pc ${isW(pc) ? 'w' : 'b'}">${GLYPH[pc]}</span>` : ''}${coF}${coR}</div>`;
    }).join('');
  };
  B.shake = () => { host.classList.add('shake'); setTimeout(() => host.classList.remove('shake'), 340) };
  host.onclick = e => {
    if(B.locked) return;
    const sq = e.target.closest('.sq'); if(!sq) return;
    const i = +sq.dataset.i;
    const hit = B.targets.find(m => m.to === i);
    if(hit){
      const proms = B.targets.filter(m => m.to === i && m.promo);
      if(proms.length){ pickPromo(B.pos.t === 'w', q => { B.sel = -1; B.targets = []; B.onMove(proms.find(m => m.promo.toLowerCase() === q) || proms[0]) }); return }
      B.sel = -1; B.targets = []; B.onMove(hit); return;
    }
    const pc = B.pos.b[i];
    if(pc && isW(pc) === (B.pos.t === 'w')){
      B.sel = i; B.targets = legal(B.pos).filter(m => m.from === i); B.hint = null;
    } else { B.sel = -1; B.targets = [] }
    B.draw();
  };
  B.draw();
  window.__board = B;   /* poignée de diagnostic (tests, console) */
  return B;
}
function pickPromo(white, cb){
  const P = white ? ['Q','R','B','N'] : ['q','r','b','n'];
  overlay(`<div class="pad center"><div class="rule"><span>Promotion</span></div>
    <div class="row" style="justify-content:center">${P.map(p =>
      `<button class="btn" data-p="${p.toLowerCase()}" style="font-size:34px;padding:10px 17px;line-height:1">${GLYPH[p]}</button>`).join('')}</div></div>`);
  $$('#overlay [data-p]').forEach(b => b.onclick = () => { closeOverlay(); cb(b.dataset.p) });
}
/** Petit diagramme statique (pour les vignettes). */
function miniBoard(fen, size){
  const p = parseFEN(fen), s = size || 116;
  let h = `<div style="display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:${s}px;height:${s}px;border:1px solid var(--edge2)">`;
  for(let i = 0; i < 64; i++){
    const r = i >> 3, c = i & 7, pc = p.b[i];
    h += `<div style="background:${(r+c)%2 ? 'var(--sq-d)' : 'var(--sq-l)'};display:grid;place-items:center;font-size:${s/9}px;line-height:1;color:${pc && isW(pc) ? '#fffdf7' : '#241a0e'};text-shadow:${pc && isW(pc) ? '0 0 1px #2a1f10' : 'none'}">${pc ? GLYPH[pc] : ''}</div>`;
  }
  return h + '</div>';
}

function openCard(id){
  const c = byId(id);
  if(!c || !tierOpen(c.tier)) return;
  rec(id).seen++; save();
  const K = KIND[c.kind];
  overlay(`
    <div class="pad grain" style="position:relative">
      <div class="corners"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
      <div class="banner">${K.n}</div>
      <div class="profile" style="margin-top:20px">
        <div>
          <div class="pname-deco"></div>
          <div class="pname">${esc(c.name)}</div>
          <div class="psub">${esc(c.sub || '')}</div>
          ${orbs(c)}
          ${leaders(c.stats)}
          ${c.fixnote ? `<div class="note" style="margin-top:14px;border-left-color:var(--wine);font-size:14px">
            <b>Position corrigée.</b> ${esc(c.fixnote)}</div>` : ''}
          <div class="rule"><span>Armes</span></div>
          <div class="relics" id="relics"></div>
        </div>
        <div>

  ({opening: mountOpening, endgame: mountEndgame, tactic: mountTactic})[c.kind](c);
}

/* Nom lisible d'une pièce, accordé en genre et en nombre. */
const PIECE_FR = {q:['Dame',1], r:['Tour',1], b:['Fou',0], n:['Cavalier',0], p:['Pion',0], k:['Roi',0]};
function pieceLabel(x, n){
  const [nom, fem] = PIECE_FR[x.toLowerCase()] || ['Pièce', 1];
  const pl = n > 1;
  const couleur = isW(x) ? (fem ? 'blanche' : 'blanc') : (fem ? 'noire' : 'noir');
  return `${pl ? n + ' ' : ''}${nom}${pl ? 's' : ''} ${couleur}${pl ? 's' : ''}`;
}

/* ---------- relics : les « armes » de la fiche ---------- */
function relicsFor(c){
  const out = [];
  if(c.kind === 'opening'){
    const seen = new Set();
    for(const m of c.moves){
      const g = /^[KQRBN]/.test(m) ? {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘'}[m[0]] : '♙';
      const key = g + (m.length > 3 ? '' : m);
      if(seen.has(key) || out.length >= 4) continue;
      seen.add(key); out.push([g, m]);
    }
  } else if(c.kind === 'endgame'){
    const p = parseFEN(c.fen);
    const cnt = {};
    p.b.forEach(x => { if(x && x.toLowerCase() !== 'k') cnt[x] = (cnt[x]||0)+1 });
    Object.keys(cnt).slice(0,4).forEach(x => out.push([GLYPH[x], pieceLabel(x, cnt[x])]));
    if(!out.length) out.push([GLYPH.K, 'Les rois seuls']);
  } else {
    out.push([c.mate ? '♛' : '⚔', c.mate ? 'Mat forcé' : 'Gain matériel']);
    const p = parseFEN(c.fen);
    const cnt = {};
    p.b.forEach(x => { if(x && x.toLowerCase() !== 'k' && isW(x)) cnt[x] = (cnt[x]||0)+1 });
    Object.keys(cnt).slice(0,3).forEach(x => out.push([GLYPH[x], pieceLabel(x, cnt[x])]));
  }
  $('#relics').innerHTML = out.map(([g,t]) =>
    `<div class="relic"><div class="ic">${g}</div><div class="cap">${esc(t)}</div></div>`).join('');
}

/* ---------- OUVERTURE : étude pas à pas + récitation ---------- */
function mountOpening(c){
  relicsFor(c);
  const st = {i:0, mode:'study', errs:0};
  const B = Board($('#cb'), {fen: START, flip: c.side === 'b', onMove: m => userMove(m)});
  const posAt = n => { let p = parseFEN(START); for(let k = 0; k < n; k++) p = makeMove(p, fromSAN(p, c.moves[k])); return p };

  function paint(){
    const p = posAt(st.i);
    B.setPos(p);
    if(st.i > 0){ const q = posAt(st.i-1); B.last = fromSAN(q, c.moves[st.i-1]) } else B.last = null;
    B.locked = st.mode === 'study';
    B.draw();
    $('#cstat').innerHTML = st.mode === 'study'
      ? `Coup ${st.i} / ${c.moves.length}`
      : (st.i >= c.moves.length ? '<b class="mut">Ligne terminée</b>'
         : (posAt(st.i).t === (c.side === 'w' ? 'w' : 'b') ? '<b>À vous de jouer</b>' : 'Réponse adverse…'));
    $('#cnote').innerHTML = st.i > 0 ? (c.notes[st.i-1] || `<b>${esc(c.moves[st.i-1])}</b>`) :
      "Parcourez la ligne coup par coup : chaque commentaire explique <em>pourquoi</em> ce coup, pas seulement lequel.";
    $('#cmoves').innerHTML = c.moves.map((m,k) =>
      (k % 2 === 0 ? `<span class="num">${k/2+1}.</span>` : '') +
      `<span class="${k === st.i-1 ? 'on' : ''}" data-k="${k}">${esc(m)}</span>`).join('');
    $$('#cmoves span[data-k]').forEach(s => s.onclick = () => { if(st.mode === 'study'){ st.i = +s.dataset.k + 1; paint() } });
    $('#bPrev').disabled = st.i === 0;
    $('#bNext').disabled = st.i >= c.moves.length;
  }
  function userMove(m){
    const p = posAt(st.i), want = fromSAN(p, c.moves[st.i]);
    if(m.from === want.from && m.to === want.to && (m.promo||'') === (want.promo||'')){
      st.i++; paint();
      if(st.i < c.moves.length){ B.locked = true; setTimeout(() => { st.i++; paint(); if(st.i >= c.moves.length) done() }, 480) }
      else done();
    } else {
      st.errs++; B.shake();
      $('#cnote').innerHTML = `<b style="color:var(--ko)">Ce n'est pas le coup de la ligne.</b> ${st.errs >= 2 ? 'Servez-vous de « Indice », puis reprenez : c\'est en refaisant sans aide que ça rentre.' : 'Relisez l\'idée générale sous l\'échiquier.'}`;
      B.sel = -1; B.targets = []; B.draw();
    }
  }
  function done(){
    B.locked = true;
    const good = st.errs === 0;
    grade(c.id, good);
    gainXP(good ? XPV.drill : Math.round(XPV.drill/3), good ? 'récitation sans faute' : 'ligne terminée');
    $('#cstat').innerHTML = good ? '<b style="color:var(--ok)">Parfait — ligne récitée sans aucune erreur.</b>'
      : `<b>Ligne terminée</b> · ${st.errs} erreur${st.errs > 1 ? 's' : ''}`;
  }
  $('#cctl').innerHTML = `
    <button class="btn sm" id="bPrev">‹ Précédent</button>
    <button class="btn sm gold" id="bNext">Coup suivant ›</button>
    <button class="btn sm" id="bDrill">Réciter de mémoire</button>
    <button class="btn sm" id="bFlip">Retourner</button>
    <button class="btn sm hide" id="bHint">Indice</button>`;
  $('#cstory').innerHTML = `
    <div class="note" id="cnote"></div>
    <div class="rule"><span>La partie</span></div>
    <div class="moves" id="cmoves"></div>
    <div class="rule"><span>L'idée</span></div>
    <p>${c.idea}</p>
    ${(c.keys||[]).length ? `<div class="rule"><span>Points clés</span></div><ul>${c.keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}
    ${(c.plans && (c.plans.w||c.plans.b)) ? `<div class="rule"><span>Plans</span></div>
      <div class="row" style="gap:22px">
        ${c.plans.w ? `<div style="flex:1;min-width:230px"><b>♙ Les Blancs cherchent à…</b><ul>${c.plans.w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${c.plans.b ? `<div style="flex:1;min-width:230px"><b>♟ Les Noirs cherchent à…</b><ul>${c.plans.b.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      </div>` : ''}
    ${c.goal ? `<div class="rule"><span>Résultat visé</span></div><p>${esc(c.goal)}</p>` : ''}`;
  if(c.traps && c.traps.length) mountTraps(c);
  $('#bPrev').onclick = () => { if(st.i > 0){ st.i--; paint() } };
  $('#bNext').onclick = () => { if(st.i < c.moves.length){ st.i++; paint(); if(st.i >= c.moves.length && st.mode === 'study'){ grade(c.id, true); gainXP(XPV.study, 'ouverture étudiée') } } };
  $('#bFlip').onclick = () => { B.flip = !B.flip; B.draw() };
  $('#bHint').onclick = () => {
    const p = posAt(st.i), w = fromSAN(p, c.moves[st.i]);
    B.hint = [w.from]; B.draw();
    $('#cnote').innerHTML = `<b style="color:var(--warn)">Indice</b> — la pièce à jouer est mise en évidence.`;
    st.errs = Math.max(st.errs, 1);
  };
  $('#bDrill').onclick = () => {
    st.mode = st.mode === 'study' ? 'drill' : 'study'; st.i = 0; st.errs = 0;
    $('#bDrill').textContent = st.mode === 'drill' ? 'Revenir à l\'étude' : 'Réciter de mémoire';
    $('#bHint').classList.toggle('hide', st.mode !== 'drill');
    $('#bPrev').classList.toggle('hide', st.mode === 'drill');
    $('#bNext').classList.toggle('hide', st.mode === 'drill');
    paint();
    if(st.mode === 'drill' && c.side === 'b'){ setTimeout(() => { st.i = 1; paint() }, 420) }
  };
  paint();
}
function mountTraps(c){
  $('#cextra').innerHTML = `<div class="rule"><span>Pièges de l'ouverture</span></div>
    <div class="gal">${c.traps.map((t,k) => `

        <div class="gn" style="font-size:17px">${esc(t.name)}</div>
        <div class="gs">${t.moves && t.moves.length ? esc(t.moves.slice(0,6).join(' ')) + '…' : 'À connaître absolument.'}</div>
        <div class="gf"><span class="tag gold">${t.moves && t.moves.length ? 'Rejouer' : 'Lire'}</span></div>
      </div>`).join('')}</div>`;
  $$('#cextra [data-trap]').forEach(el => el.onclick = () => showTrap(c, c.traps[+el.dataset.trap]));
}
function showTrap(c, t){
  overlay(`<div class="pad grain">
    <div class="corners"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
    <div class="banner">Piège</div>
    <div class="profile" style="margin-top:18px">
      <div>
        <div class="pname" style="font-size:29px">${esc(t.name)}</div>
        <div class="psub">${esc(c.name)}</div>
        <div class="prose" style="margin-top:14px">${t.text || ''}</div>
      </div>
      <div>
        ${t.moves && t.moves.length ? `<div class="boardbox"><div class="board" id="tb"></div></div>
        <div class="bstat" id="tstat"></div>
        <div class="bctl">
          <button class="btn sm" id="tPrev">‹</button>
          <button class="btn sm gold" id="tNext">Coup suivant ›</button>
          <button class="btn sm" id="tBack">Retour à la fiche</button></div>
        <div class="moves" id="tmoves" style="margin-top:11px"></div>` :
        `<div class="center dim">Ce piège se comprend à la lecture — pas de ligne à rejouer.</div>
         <div class="bctl"><button class="btn sm" id="tBack">Retour à la fiche</button></div>`}
      </div>
    </div></div>`);
  $('#tBack').onclick = () => openCard(c.id);
  if(!(t.moves && t.moves.length)) return;
  let i = 0;
  const B = Board($('#tb'), {fen: START, flip: false});
  B.locked = true;
  const posAt = n => { let p = parseFEN(START); for(let k = 0; k < n; k++) p = makeMove(p, fromSAN(p, t.moves[k])); return p };
  const paint = () => {
    const p = posAt(i); B.setPos(p);
    if(i > 0){ const q = posAt(i-1); B.last = fromSAN(q, t.moves[i-1]) }
    B.locked = true; B.draw();
    $('#tstat').innerHTML = i >= t.moves.length ? '<b>Fin de la ligne</b>' : `Coup ${i} / ${t.moves.length}`;
    $('#tmoves').innerHTML = t.moves.map((m,k) => (k%2===0 ? `<span class="num">${k/2+1}.</span>` : '') +
      `<span class="${k === i-1 ? 'on' : ''}">${esc(m)}</span>`).join('');
    $('#tPrev').disabled = i === 0; $('#tNext').disabled = i >= t.moves.length;
  };
  $('#tPrev').onclick = () => { if(i > 0){ i--; paint() } };
  $('#tNext').onclick = () => { if(i < t.moves.length){ i++; paint(); if(i >= t.moves.length) gainXP(XPV.trap, 'piège étudié') } };
  paint();
}

/* ---------- FINALE : théorie + jeu contre le moteur ---------- */
function mountEndgame(c){
  relicsFor(c);
  if(c.goal === 'line'){ mountLine(c); return }
  const st = {over:false, moves:[]};
  const B = Board($('#cb'), {fen: c.fen, flip: c.side === 'b', onMove: m => play(m)});
  $('#cctl').innerHTML = `
    <button class="btn sm gold" id="bHint">Indice</button>
    <button class="btn sm" id="bAgain">Recommencer</button>
    <button class="btn sm" id="bFlip">Retourner</button>`;
  $('#cstory').innerHTML = `
    <div class="note" id="cnote">${esc(c.sub || '')}</div>
    ${c.steps && c.steps.length ? `<div class="rule"><span>La marche à suivre</span></div>
      <ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
    <div class="rule"><span>La théorie</span></div>
    <div>${c.theory || `<p>${esc(c.idea)}</p>`}</div>`;
  const stat = h => $('#cstat').innerHTML = h;
  stat(`<b>${{mate:'Objectif : mater',promo:'Objectif : promouvoir',draw:'Objectif : annuler','draw-lesson':'Comprenez pourquoi c\'est nulle'}[c.goal] || ''}</b>`);

  function finish(ok, msg){
    st.over = true; B.locked = true;
    stat(`<b style="color:${ok ? 'var(--ok)' : 'var(--ko)'}">${msg}</b>`);
    grade(c.id, ok);
    if(ok) gainXP(XPV.endWin, 'finale réussie');
    return true;                 /* <- indispensable : check() propage ce booléen */
  }
  function check(){
    const p = B.pos;
    if(isMate(p)){
      const winnerWhite = p.t === 'b';
      const mine = (c.side === 'w') === winnerWhite;
      return finish(mine && c.goal === 'mate', mine ? 'Mat ! Technique maîtrisée.' : 'Vous êtes maté.');
    }
    if(isStale(p)) return finish(c.goal === 'draw' || c.goal === 'draw-lesson', c.goal.startsWith('draw') ? 'Pat — c\'est exactement la nulle recherchée.' : 'Pat : la partie est nulle, l\'objectif est manqué.');
    if(insufficient(p)) return finish(c.goal === 'draw' || c.goal === 'draw-lesson', c.goal.startsWith('draw') ? 'Matériel insuffisant — nulle obtenue.' : 'Matériel insuffisant : nulle.');
    const mySide = c.side === 'w' ? 'W' : 'B';
    const startQ = parseFEN(c.fen).b.filter(x => x && x.toLowerCase() === 'q' && isW(x) === (mySide === 'W')).length;
    const nowQ = p.b.filter(x => x && x.toLowerCase() === 'q' && isW(x) === (mySide === 'W')).length;
    if(c.goal === 'promo' && nowQ > startQ) return finish(true, 'Promotion ! Le pion est passé.');
    if(p.half >= 100) return finish(c.goal.startsWith('draw'), 'Règle des 50 coups : nulle.');
    return false;
  }
  function reply(){
    B.locked = true;
    setTimeout(() => {
      if(st.over) return;
      const m = bestMove(B.pos, 3);
      if(!m){ check(); return }
      B.setPos(makeMove(B.pos, m)); B.last = m; B.draw();
      if(!check()) B.locked = false;
    }, 340);
  }
  function play(m){
    if(st.over) return;
    const s = san(B.pos, m);
    st.moves.push(s);
    B.setPos(makeMove(B.pos, m)); B.last = m; B.draw();
    $('#cnote').innerHTML = `Vous avez joué <b>${esc(s)}</b>. Le moteur défend au mieux : s'il tient, c'est que la technique n'est pas encore juste.`;
    if(!check()) reply();
  }
  $('#bHint').onclick = () => {
    if(st.over) return;
    const m = bestMove(B.pos, 4);
    if(m){ B.hint = [m.from]; B.draw(); $('#cnote').innerHTML = `<b style="color:var(--warn)">Indice</b> — commencez par cette pièce.` }
  };
  $('#bAgain').onclick = () => { st.over = false; st.moves = []; B.set(c.fen); B.locked = false; stat('<b>On reprend depuis le début.</b>') };
  $('#bFlip').onclick = () => { B.flip = !B.flip; B.draw() };
}
/** Finale « ligne à rejouer » (mes fiches vérifiées coup par coup). */
function mountLine(c){
  const st = {i:0, errs:0};
  const B = Board($('#cb'), {fen: c.fen, flip: c.side === 'b', onMove: m => userMove(m)});
  const posAt = n => { let p = parseFEN(c.fen); for(let k = 0; k < n; k++) p = makeMove(p, fromSAN(p, c.moves[k])); return p };
  $('#cctl').innerHTML = `<button class="btn sm gold" id="bNext">Coup suivant ›</button>
    <button class="btn sm" id="bPrev">‹ Précédent</button>
    <button class="btn sm" id="bFlip">Retourner</button>`;
  $('#cstory').innerHTML = `<div class="note" id="cnote"></div>
    <div class="rule"><span>La technique</span></div>
    <div class="moves" id="cmoves"></div>
    <div class="rule"><span>L'idée</span></div><p>${c.idea}</p>
    ${(c.keys||[]).length ? `<div class="rule"><span>Points clés</span></div><ul>${c.keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}
    ${c.goaltxt ? `<p style="margin-top:10px"><b>Résultat :</b> ${esc(c.goaltxt)}</p>` : ''}
    ${c.trap ? `<div class="note" style="border-left-color:var(--wine);margin-top:12px">${esc(c.trap)}</div>` : ''}`;
  function paint(){
    B.setPos(posAt(st.i));
    if(st.i > 0){ const q = posAt(st.i-1); B.last = fromSAN(q, c.moves[st.i-1]) } else B.last = null;
    B.locked = true; B.draw();
    $('#cstat').innerHTML = `Coup ${st.i} / ${c.moves.length}`;
    $('#cnote').innerHTML = st.i > 0 ? (c.notes[st.i-1] || `<b>${esc(c.moves[st.i-1])}</b>`) : esc(c.sub || '');
    $('#cmoves').innerHTML = c.moves.map((m,k) => (k%2===0 ? `<span class="num">${k/2+1}.</span>` : '') +
      `<span class="${k === st.i-1 ? 'on' : ''}" data-k="${k}">${esc(m)}</span>`).join('');
    $$('#cmoves span[data-k]').forEach(s => s.onclick = () => { st.i = +s.dataset.k+1; paint() });
    $('#bPrev').disabled = st.i === 0; $('#bNext').disabled = st.i >= c.moves.length;
  }
  function userMove(){}
  $('#bNext').onclick = () => { if(st.i < c.moves.length){ st.i++; paint(); if(st.i >= c.moves.length){ grade(c.id, true); gainXP(XPV.line, 'technique parcourue') } } };
  $('#bPrev').onclick = () => { if(st.i > 0){ st.i--; paint() } };
  $('#bFlip').onclick = () => { B.flip = !B.flip; B.draw() };
  relicsFor(c); paint();
}

/* ---------- TACTIQUE : exercice ou démonstration ---------- */
function mountTactic(c){
  relicsFor(c);
  if(c.moves && c.moves.length){ mountLine(Object.assign({}, c, {goal:'line'})); return }
  const st = {i:0, done:false, errs:0};
  const B = Board($('#cb'), {fen: c.fen, flip: c.side === 'b', onMove: m => tryMove(m)});
  $('#cctl').innerHTML = `<button class="btn sm gold" id="bHint">Indice</button>
    <button class="btn sm" id="bSol">Voir la solution</button>
    <button class="btn sm" id="bAgain">Recommencer</button>`;
  $('#cstory').innerHTML = `<div class="note" id="cnote">Trouvez le meilleur coup. Prenez le temps de regarder <em>toutes</em> les pièces en prise avant de jouer.</div>
    <div class="rule"><span>Le motif</span></div><div id="ctext" class="hide">${c.text || ''}</div>
    <p id="cveil" class="dim">L'explication du motif apparaît une fois l'exercice résolu — cherchez d'abord.</p>`;
  $('#cstat').innerHTML = `<b>${c.mate ? 'Trouvez le mat' : 'Gagnez du matériel'}</b>`;
  const posAt = n => { let p = parseFEN(c.fen); for(let k = 0; k < n; k++) p = makeMove(p, fromSAN(p, c.sol[k])); return p };
  function reveal(ok){
    st.done = true; B.locked = true;
    $('#ctext').classList.remove('hide'); $('#cveil').classList.add('hide');
    grade(c.id, ok && st.errs === 0);
    if(ok) gainXP(st.errs === 0 ? XPV.tac : Math.round(XPV.tac/3), st.errs === 0 ? 'tactique résolue' : 'tactique vue');
  }
  function tryMove(m){
    if(st.done) return;
    const p = posAt(st.i), want = fromSAN(p, c.sol[st.i]);
    if(m.from === want.from && m.to === want.to && (m.promo||'') === (want.promo||'')){
      st.i++;
      B.setPos(posAt(st.i)); B.last = want; B.draw();
      if(st.i >= c.sol.length){
        $('#cstat').innerHTML = `<b style="color:var(--ok)">${c.mate ? 'Mat !' : 'Trouvé !'}</b>`;
        $('#cnote').innerHTML = `<b>${esc(c.sol.join(' '))}</b> — exactement ça.`;
        reveal(true);
      } else {
        // réponse forcée de l'adversaire
        setTimeout(() => {
          const q = posAt(st.i), r = fromSAN(q, c.sol[st.i]);
          st.i++; B.setPos(posAt(st.i)); B.last = r; B.draw();
          $('#cnote').innerHTML = `Bien. L'adversaire répond <b>${esc(c.sol[st.i-1])}</b> — continuez.`;
          if(st.i >= c.sol.length){ $('#cstat').innerHTML = '<b style="color:var(--ok)">Séquence complète !</b>'; reveal(true) }
        }, 450);
      }
    } else {
      st.errs++; B.shake(); B.sel = -1; B.targets = []; B.draw();
      $('#cnote').innerHTML = `<b style="color:var(--ko)">Pas celui-là.</b> ${st.errs >= 2 ? 'Utilisez l\'indice : ' + esc(c.hint || 'cherchez le coup le plus forçant.') : 'Cherchez le coup le plus <em>forçant</em> : échec, prise, ou menace imparable.'}`;
    }
  }
  $('#bHint').onclick = () => {
    if(st.done) return;
    const p = posAt(st.i), w = fromSAN(p, c.sol[st.i]);
    B.hint = [w.from]; B.draw(); st.errs = Math.max(st.errs, 1);
    $('#cnote').innerHTML = `<b style="color:var(--warn)">Indice</b> — ${esc(c.hint || 'commencez par cette pièce.')}`;
  };
  $('#bSol').onclick = () => {
    st.errs = 9;
    let k = 0;
    const step = () => {
      if(k >= c.sol.length){ $('#cstat').innerHTML = '<b>Solution complète</b>'; reveal(false); return }
      const p = posAt(k), m = fromSAN(p, c.sol[k]); k++;
      B.setPos(posAt(k)); B.last = m; B.draw();
      $('#cnote').innerHTML = `<b>${esc(c.sol.slice(0,k).join(' '))}</b>`;
      setTimeout(step, 620);
    };
    st.i = 0; B.set(c.fen); step();
  };
  $('#bAgain').onclick = () => { st.i = 0; st.done = false; st.errs = 0; B.set(c.fen); B.locked = false;
    $('#ctext').classList.add('hide'); $('#cveil').classList.remove('hide');
    $('#cnote').innerHTML = 'On recommence. Cherchez le coup forçant.'; };
}
