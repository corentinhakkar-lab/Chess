        <div class="pname" style="font-size:31px">Le duel</div>
        <div class="psub">Contre le moteur embarqué</div>
        <div class="rule"><span>Réglages</span></div>
        <div class="row" style="gap:9px;align-items:center">
          <select id="gLvl">
            <option value="1">Niveau 1 — apprenti</option>
            <option value="2" selected>Niveau 2 — écuyer</option>
            <option value="3">Niveau 3 — chevalier</option>
          </select>
          <select id="gSide"><option value="w">Jouer les Blancs</option><option value="b">Jouer les Noirs</option></select>
        </div>
        <div class="bctl" style="justify-content:flex-start;margin-top:13px">
          <button class="btn gold" id="gNew">Nouvelle partie</button>
          <button class="btn sm" id="gUndo">Annuler le coup</button>
          <button class="btn sm" id="gFlip">Retourner</button>
        </div>
        <div class="rule"><span>Coups joués</span></div>
        <div class="moves" id="gMoves"></div>
        <div class="rule"><span>Conseil</span></div>
        <p class="mut" style="font-size:14.5px">Avant chaque coup, posez-vous une seule question :
        <em>« qu'est-ce que mon adversaire menace ? »</em> La moitié des parties perdues le sont pour avoir oublié de la poser.</p>
      </div>
      <div>
        <div class="boardbox"><div class="board" id="gb"></div></div>
        <div class="bstat" id="gStat">Choisissez vos réglages puis lancez la partie.</div>
      </div>
    </div></div>`;
  const host = $('#gb');
  G = {board: null, over: false, hist: [], level: 2, side: 'w'};
  G.board = Board(host, {fen: START, onMove: m => gPlay(m)});
  G.board.locked = true;
  $('#gNew').onclick = gNew; $('#gUndo').onclick = gUndo;
  $('#gFlip').onclick = () => { G.board.flip = !G.board.flip; G.board.draw() };
}
function gNew(){
  G.level = +$('#gLvl').value; G.side = $('#gSide').value;
  G.over = false; G.hist = [];
  G.board.set(START); G.board.flip = G.side === 'b'; G.board.locked = false; G.board.draw();
  $('#gStat').innerHTML = '<b>À vous.</b> Bonne partie.';
  $('#gMoves').innerHTML = '';
  if(G.side === 'b') gReply();
}
function gPaintMoves(){
  $('#gMoves').innerHTML = G.hist.map((m,i) => (i%2===0 ? `<span class="num">${i/2+1}.</span>` : '') + `<span>${esc(m)}</span>`).join('');
}
function gEnd(msg, res){
  G.over = true; G.board.locked = true;
  $('#gStat').innerHTML = `<b>${msg}</b>`;
  if(res === 'w'){ S.games.w++; gainXP(XPV.game[G.level-1], 'victoire') }
  else if(res === 'd'){ S.games.d++; gainXP(Math.round(XPV.game[G.level-1]/4), 'nulle') }
  else S.games.l++;
  save();
}
function gCheck(){
  const p = G.board.pos;
  if(isMate(p)){
    const winnerWhite = p.t === 'b', mine = (G.side === 'w') === winnerWhite;
    gEnd(mine ? 'Échec et mat — vous gagnez !' : 'Échec et mat. Le moteur gagne.', mine ? 'w' : 'l');
    return true;
  }
  if(isStale(p)){ gEnd('Pat — partie nulle.', 'd'); return true }
  if(insufficient(p)){ gEnd('Matériel insuffisant — nulle.', 'd'); return true }
  if(p.half >= 100){ gEnd('Règle des 50 coups — nulle.', 'd'); return true }
  return false;
}
function gPlay(m){
  if(G.over) return;
  G.hist.push(san(G.board.pos, m));
  G.board.setPos(makeMove(G.board.pos, m)); G.board.last = m; G.board.draw(); gPaintMoves();
  if(gCheck()) return;
  gReply();
}
function gReply(){
  G.board.locked = true;
  $('#gStat').innerHTML = '<span class="dim">Le moteur réfléchit…</span>';
  setTimeout(() => {
    const m = bestMove(G.board.pos, G.level);
    if(!m){ gCheck(); return }
    G.hist.push(san(G.board.pos, m));
    G.board.setPos(makeMove(G.board.pos, m)); G.board.last = m; G.board.draw(); gPaintMoves();
    if(gCheck()) return;
    G.board.locked = false;
    $('#gStat').innerHTML = inCheck(G.board.pos, G.board.pos.t === 'w') ? '<b style="color:var(--ko)">Échec !</b>' : '<b>À vous.</b>';
  }, 60);
}
function gUndo(){
  if(G.over || G.hist.length < 2) return;
  G.hist = G.hist.slice(0, -2);
  let p = parseFEN(START);
  for(const s of G.hist) p = makeMove(p, fromSAN(p, s));
  G.board.setPos(p); G.board.last = null; G.board.locked = false; G.board.draw(); gPaintMoves();
  $('#gStat').innerHTML = '<b>Coup annulé.</b> À vous.';
}

/* ---------- CODEX ---------- */
function vCodex(){
  const rows = CARDS.map(c => `<tr>
    <td>${esc(c.name)}</td><td class="dim">${KIND[c.kind].ic}</td><td class="dim">${c.tier}</td>
    <td>${starHTML(stars(c.id))}</td><td class="dim">${rec(c.id).ok}</td>
    <td class="dim">${S.items[c.id] && S.items[c.id].next ? (isDue(c.id) ? '<b style="color:var(--wine)">maintenant</b>' : S.items[c.id].next) : '—'}</td></tr>`).join('');
  $('#v-codex').innerHTML = `<div class="sheet grain pad">
    <div class="corners"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
    <div class="banner">Codex</div>
    <div class="rule"><span>Les principes</span></div>
    <div class="gal">${PRINCIPLES.map((p,i) => `<div class="gcard" onclick="showPrinciple(${i})">
      <div class="gn" style="font-size:18px">${esc(p.t || ('Principe ' + (i+1)))}</div>
      <div class="gs">${esc((p.c || '').replace(/<[^>]+>/g,'').slice(0,110))}…</div>
      <div class="gf"><span class="tag gold">Lire</span></div></div>`).join('')}</div>

    <div class="rule"><span>Comment progresser</span></div>
    <div class="prose" style="max-width:72ch">
      <p><b>1. Le Donjon d'abord.</b> Chaque jour. C'est la répétition espacée qui transforme « j'ai compris » en « je sais ».</p>
      <p><b>2. Étudier puis réciter.</b> Sur une ouverture, faites l'étude commentée, puis « Réciter de mémoire ». Tant que vous ne récitez pas sans faute, ce n'est pas acquis.</p>
      <p><b>3. Les finales se jouent, ne se lisent pas.</b> Le moteur défend au mieux : s'il tient, votre technique est encore approximative.</p>
      <p><b>4. Priorité aux finales et aux tactiques.</b> Contre-intuitif, mais en dessous de 1800 Elo les parties se décident là — pas sur le 12ᵉ coup d'une Najdorf.</p>
      <p><b>5. Jouer de vraies parties longues.</b> Deux ou trois par semaine, en 15+10. Notez votre Elo ci-dessous.</p>
    </div>

    <div class="rule"><span>Classement Elo</span></div>
    <div class="row" style="align-items:center;gap:9px">
      <input type="number" id="eloIn" placeholder="ex. 1240" style="width:135px">
      <button class="btn sm" id="eloAdd">Enregistrer</button>
      <span class="dim" style="font-size:14px">${S.elo.length ? `Actuel ${S.elo[S.elo.length-1].v} · départ ${S.elo[0].v} (${S.elo[S.elo.length-1].v - S.elo[0].v >= 0 ? '+' : ''}${S.elo[S.elo.length-1].v - S.elo[0].v})` : 'aucune mesure'}</span>
    </div>
    ${S.elo.length > 1 ? `<div style="margin-top:12px">${spark(S.elo.map(e => e.v))}</div>` : ''}

    <div class="rule"><span>Fiabilité du contenu</span></div>
    <div class="prose" style="max-width:72ch">
      <p>Les <b>${CARDS.length} fiches</b> ont été vérifiées coup par coup par un moteur d'échecs avant d'être intégrées :
      chaque coup est légal, chaque mat annoncé en est un, aucun pat involontaire, aucune position impossible.</p>
      <p>Deux positions ont dû être <b>corrigées</b> à cette occasion :</p>
      <ul>
        <li><b>Le mat arabe</b> — la tour partait d'une case où elle faisait déjà échec : la position ne pouvait pas exister.</li>
        <li><b>L'opposition</b> — l'exercice demandait de promouvoir une position <em>objectivement nulle</em>.
        Un solveur exact (les 331 352 positions Roi+Pion contre Roi, résolues par analyse rétrograde) a tranché.
        La nouvelle position est gagnante, et seuls les coups de roi conservent le gain : la leçon est enfin démontrable.</li>
      </ul>
    </div>

    <div class="rule"><span>Vos fiches</span></div>
    <div style="overflow-x:auto"><table>
      <tr><th>Fiche</th><th></th><th>P.</th><th>Maîtrise</th><th>Réussies</th><th>Révision</th></tr>${rows}</table></div>

    <div class="rule"><span>Sauvegarde</span></div>
    <p class="mut" style="font-size:14.5px">Tout est stocké dans ce navigateur uniquement. Exportez de temps en temps :
    effacer les données de navigation effacerait votre progression.</p>
    <div class="bctl" style="justify-content:flex-start">
      <button class="btn sm" id="svExp">Exporter</button>
      <button class="btn sm" id="svImp">Importer</button>
      <button class="btn sm" id="svRst" style="border-color:var(--ko);color:var(--ko)">Réinitialiser</button>
      <input type="file" id="svFile" accept="application/json" class="hide">
    </div>
  </div>`;
  $('#eloAdd').onclick = () => {
    const v = +$('#eloIn').value;
    if(!v || v < 100 || v > 3500) return toast('Entrez un Elo entre 100 et 3500.');
    S.elo.push({d: today(), v}); save(); gainXP(XPV.elo, 'Elo enregistré'); vCodex();
  };
  $('#svExp').onclick = () => {
    const b = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'echecs_hunter_' + today() + '.json'; a.click();
    toast('Sauvegarde exportée.');
  };
  $('#svImp').onclick = () => $('#svFile').click();
  $('#svFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ S = Object.assign(fresh(), JSON.parse(r.result)); save(); render(); toast('Sauvegarde importée.') }catch(x){ toast('Fichier illisible.') } };
    r.readAsText(f);
  };
  $('#svRst').onclick = () => { if(confirm('Effacer toute votre progression ? Action irréversible.')){ S = fresh(); save(); render(); toast('Progression réinitialisée.') } };
}
function showPrinciple(i){
  const p = PRINCIPLES[i];
  overlay(`<div class="pad grain">
    <div class="corners"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
    <div class="banner">Principe</div>
    <div style="max-width:70ch;margin:20px auto 0">
      <div class="pname" style="font-size:31px">${esc(p.t || '')}</div>
      <div class="prose" style="margin-top:13px">${p.c || ''}</div>
    </div></div>`);
  const o = rec('princ-' + i);
  if(!o.ok){ o.ok = 1; save(); gainXP(XPV.princ, 'principe lu') }
}
function spark(vals){
  const w = 600, h = 62, mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx - mn) || 1;
  const pts = vals.map((v,i) => `${(i/(vals.length-1||1)*w).toFixed(1)},${(h - (v-mn)/sp*(h-10) - 5).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
    ${vals.map((v,i) => `<circle cx="${(i/(vals.length-1||1)*w).toFixed(1)}" cy="${(h-(v-mn)/sp*(h-10)-5).toFixed(1)}" r="2.5" fill="var(--gold)"/>`).join('')}</svg>`;
}

/* ==========================================================
   NAVIGATION
   ========================================================== */
const VIEWS = {profil:vProfil, donjon:vDonjon, ouvertures:vOpen, finales:vEnd, tactiques:vTac, partie:vGame, codex:vCodex};
let CURRENT = 'profil';
function go(v){
  CURRENT = v;
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $$('.view').forEach(s => s.classList.remove('on'));
  $('#v-' + ({profil:'profil',donjon:'donjon',ouvertures:'open',finales:'end',tactiques:'tac',partie:'game',codex:'codex'})[v]).classList.add('on');
  VIEWS[v]();
  window.scrollTo(0,0);
}
function render(){ VIEWS[CURRENT](); paintHead() }
function paintHead(){
  const lvl = levelOf(S.xp), rk = rankOf(lvl);
  $('#hLvl').textContent = S.xp.toLocaleString('fr-FR');
  $('#hRank').textContent = `Rang ${rk} · Niv. ${lvl}`;
  const n = dueList().length, pip = $('#pipDonjon');
  pip.textContent = n; pip.classList.toggle('hide', !n);
}
function applyTheme(){
  document.documentElement.dataset.theme = S.theme === 'dark' ? 'dark' : 'light';
  $('#themeBtn').textContent = S.theme === 'dark' ? '☾' : '☀';
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.content = S.theme === 'dark' ? '#221b12' : '#f4ead4';
}
$$('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#themeBtn').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme() };

applyTheme();
paintHead();
go('profil');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
</body>
</html>
